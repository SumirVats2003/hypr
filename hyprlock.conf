source = $HOME/.config/hypr/theme/nord.conf

$font = RecMonoLinear Nerd Font

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = false
}

# BACKGROUND
background {
  monitor =
  path = ~/Pictures/wallpapers/nord_lake.png
  blur_passes = 2
  color = $base
}

# TIME
label {
  monitor =
  text = $TIME
  color = $blue
  font_size = 72
  font_family = $font
  position = 0, -80
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 24
  font_family = $font
  position = 0, -200
  halign = center
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 160, 40
  outline_thickness = 2
  dots_size = 0.1
  dots_spacing = 0.2
  dots_center = true
  outer_color = $blue
  inner_color = $background
  font_color = $text
  font_size = 18
  fade_on_empty = false
  placeholder_text = 󰌾 Logged in as $USER
  hide_input = false
  check_color = $green
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, 100
  halign = center
  valign = bottom
}
